<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Staff Login | Central IT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">

<div class="landing-wrapper">
    <div class="landing-card">
        <div class="landing-brand">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h1>IT Staff Login</h1>
        <p>Enter your credentials to access the management dashboard.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@centralit.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" required placeholder="••••••••" style="padding-right: 40px;">
                    <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;">
                        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>
            
            <div id="loginResult" style="color: var(--danger); font-size: 13px; font-weight: 500; text-align: center; margin-bottom: 16px;"></div>

            <div class="action-stack" id="formActions">
                <button type="submit" id="loginSubmitBtn" class="btn btn-primary">Sign In</button>
                <a href="index.html" class="btn btn-secondary">&larr; Back to Portal</a>
            </div>
        </form>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
